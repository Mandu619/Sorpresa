<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorpresa ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff9ec4,#ffd6e7,#fff);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
h1{color:#d81b60;font-size:32px;margin-bottom:15px}
p{font-size:18px;padding:0 25px}
button{
  position:absolute;
  padding:16px 28px;
  font-size:18px;
  border:none;
  border-radius:40px;
  background:#ff4081;
  color:white;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
  z-index:10;
}
#mensaje{
  display:none;
  padding:25px;
  animation:aparece 1s;
}
#mensaje h2{
  font-size:42px;
  color:#e91e63;
  margin-bottom:20px;
}
.corazon{
  position:absolute;
  bottom:-40px;
  font-size:28px;
  animation:subir linear infinite;
}
@keyframes subir{
  from{transform:translateY(0);opacity:1}
  to{transform:translateY(-110vh);opacity:0}
}
@keyframes aparece{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}
</style>
</head>

<body>

<div id="inicio">
  <h1>❤️ Tengo algo que decirte ❤️</h1>
  <p>Presiona el botón... si puedes 😜</p>
</div>

<div id="mensaje">
  <h2>💖 Te amo 💖</h2>
  <p>
    Quería hacer algo distinto para recordarte lo mucho que significas para mí.<br><br>
    Gracias por estar en mi vida, por hacer mis días más bonitos y por ser una persona tan especial.<br><br>
    Te elegiría una y mil veces ❤️
  </p>
</div>

<button id="boton">Atrápame ❤️</button>

<script>
const boton = document.getElementById("boton");
const inicio = document.getElementById("inicio");
const mensaje = document.getElementById("mensaje");

let contador = 0;
const intentosAntesDelMensaje = 18;

const frases = [
  "Casi 😜",
  "Muy lenta 😅",
  "Otra vez 😂",
  "No me atrapas ❤️",
  "Sigue intentando 🙈",
  "Estuviste cerca 😏",
  "Un intento más 💕",
  "Jajaja no 😆",
  "Ahora sí... o no 🤭",
  "Ya casi amor ❤️"
];

function moverBoton() {
  contador++;

  if (contador >= intentosAntesDelMensaje) {
    mostrarMensaje();
    return;
  }

  const margen = 20;
  const anchoBoton = boton.offsetWidth;
  const altoBoton = boton.offsetHeight;

  const maxX = window.innerWidth - anchoBoton - margen;
  const maxY = window.innerHeight - altoBoton - margen;

  const x = Math.random() * (maxX - margen) + margen;
  const y = Math.random() * (maxY - margen) + margen;

  boton.style.left = x + "px";
  boton.style.top = y + "px";
  boton.innerHTML = frases[Math.floor(Math.random() * frases.length)];
}

function mostrarMensaje() {
  boton.remove();
  inicio.style.display = "none";
  mensaje.style.display = "block";

  for (let i = 0; i < 90; i++) {
    const corazon = document.createElement("div");
    corazon.className = "corazon";
    corazon.innerHTML = Math.random() > 0.5 ? "❤️" : "💖";
    corazon.style.left = Math.random() * 100 + "vw";
    corazon.style.animationDuration = Math.random() * 4 + 3 + "s";
    corazon.style.fontSize = Math.random() * 22 + 18 + "px";
    document.body.appendChild(corazon);
  }
}

boton.addEventListener("click", moverBoton);
boton.addEventListener("touchstart", function(e){
  e.preventDefault();
  moverBoton();
});

boton.style.left = (window.innerWidth / 2 - 70) + "px";
boton.style.top = (window.innerHeight / 2 + 70) + "px";
</script>

</body>
</html>
